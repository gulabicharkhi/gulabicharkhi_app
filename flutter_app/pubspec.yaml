name: gulabi_charkhi
description: Gulabi Charkhi - Kite Battle Arena App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.1.0
  
  # Local storage (token save karne ke liye)
  shared_preferences: ^2.2.2
  
  # Invite QR code (team page)
  qr_flutter: ^4.1.0

  # Icons
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.2
  mobile_scanner: ^5.2.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
